name: Telegram DC & GitHub Dual-Channel Monitor

on:
  schedule:
    - cron: '*/30 * * * *'  # 每 30 分钟自动检查一次
  workflow_dispatch:      # 支持在 Actions 页面手动点击触发测试

jobs:
  dual-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Dual-Channel Monitor and Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python - <<'EOF'
          import os
          import socket
          import time
          import requests
          import smtplib
          from email.header import Header
          from email.mime.text import MIMEText

          # 读取环境变量
          bot_token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")
          mail_server = os.getenv("MAIL_SERVER")
          
          # 修复：安全解析 MAIL_PORT，防止空字符串导致 int() 报错
          mail_port_env = os.getenv("MAIL_PORT")
          mail_port = int(mail_port_env) if mail_port_env and mail_port_env.strip() else 465

          mail_user = os.getenv("MAIL_USERNAME")
          mail_pass = os.getenv("MAIL_PASSWORD")
          mail_to = os.getenv("MAIL_TO")

          issues = []
          report_lines = []

          # 1. 检查 Telegram 5 个核心 DC 连通性
          dcs = {
              "DC1 (Miami, USA)": ("149.154.175.53", 443),
              "DC2 (Amsterdam, NL)": ("149.154.167.51", 443),
              "DC3 (Miami, USA)": ("149.154.175.100", 443),
              "DC4 (Amsterdam, NL)": ("149.154.167.91", 443),
              "DC5 (Singapore)": ("91.108.56.130", 443)
          }

          report_lines.append("<b>【Telegram 5 DCs Status】</b>")
          for dc_name, (host, port) in dcs.items():
              start_time = time.time()
              try:
                  sock = socket.create_connection((host, port), timeout=5)
                  sock.close()
                  latency = round((time.time() - start_time) * 1000)
                  report_lines.append(f"• {dc_name}: 🟢 正常 ({latency}ms)")
              except Exception:
                  issues.append(f"Telegram {dc_name} 连接失败")
                  report_lines.append(f"• {dc_name}: ❌ 连接超时/失败")

          # 2. 检查 GitHub 官方状态
          report_lines.append("<br><b>【GitHub Status】</b>")
          try:
              res = requests.get("https://www.githubstatus.com/api/v2/summary.json", timeout=10)
              data = res.json()
              indicator = data.get("status", {}).get("indicator", "none")
              description = data.get("status", {}).get("description", "All Systems Operational")
              
              if indicator == "none":
                  report_lines.append(f"• 全局状态: 🟢 正常 ({description})")
              else:
                  issues.append(f"GitHub 全局异常: {description}")
                  report_lines.append(f"• 全局状态: 🔴 异常 ({description})")
                  
                  for comp in data.get("components", []):
                      if comp.get("status") != "operational":
                          report_lines.append(f"  - 故障组件: {comp.get('name')} ({comp.get('status')})")
          except Exception as e:
              issues.append(f"无法请求 GitHub Status API: {e}")
              report_lines.append(f"• GitHub 状态检查接口请求失败: {e}")

          # 如果有异常，则双通道推送告警
          if issues:
              subject = "🚨 【系统告警】Telegram DC 或 GitHub 服务出现异常！"
              html_content = f"<h3>⚠️ 检测到以下基础设施故障：</h3>" + "<br>".join(report_lines) + f"<br><br><hr><small>Triggered by GitHub Actions Auto-Monitor</small>"
              
              # 发送 Telegram 消息
              if bot_token and chat_id:
                  tg_text = "🚨 **基础设施异常告警！**\n\n" + "\n".join(report_lines).replace("<b>", "").replace("</b>", "").replace("<br>", "\n")
                  try:
                      requests.post(
                          f"https://api.telegram.org/bot{bot_token}/sendMessage",
                          json={"chat_id": chat_id, "text": tg_text, "parse_mode": "Markdown", "disable_web_page_preview": True},
                          timeout=10
                      )
                      print("Telegram 告警发送成功。")
                  except Exception as ex:
                      print(f"Telegram 发送失败: {ex}")

              # 发送电子邮件（只有当完整配置了邮件相关参数时才尝试发送）
              if all([mail_server, mail_user, mail_pass, mail_to]) and mail_server.strip():
                  try:
                      msg = MIMEText(html_content, 'html', 'utf-8')
                      msg['From'] = Header(f"Monitor Bot <{mail_user}>", 'utf-8')
                      msg['To'] = Header(mail_to, 'utf-8')
                      msg['Subject'] = Header(subject, 'utf-8')

                      server = smtplib.SMTP_SSL(mail_server, mail_port)
                      server.login(mail_user, mail_pass)
                      server.sendmail(mail_user, [mail_to], msg.as_string())
                      server.quit()
                      print("邮件告警发送成功。")
                  except Exception as ex:
                      print(f"邮件发送失败: {ex}")
              else:
                  print("邮件配置不完整或未启用，已跳过邮件发送。")
              
              exit(1) # 使 Action 标记为失败，方便后台追踪
          else:
              print("所有监控目标运行正常，无需告警：")
              print("\n".join(report_lines))
          EOF
